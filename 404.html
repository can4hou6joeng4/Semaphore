<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Page Not Found | Semaphore</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#050a06">
<meta name="description" content="The requested Semaphore page could not be found.">
<link rel="preload" as="font" type="font/woff2" href="/fonts/jetbrains-mono-v2.304-subset.woff2" crossorigin>
<style>
  .not-found {
    min-height: calc(100vh - var(--header-h) - var(--statusbar-h));
    display: grid;
    place-items: center;
    text-align: center;
  }
  .not-found-inner { max-width: 720px; }
  .not-found-code {
    color: var(--green);
    font-size: 180px;
    font-weight: 700;
    line-height: .8;
    text-shadow: var(--glow);
  }
  .not-found-actions { justify-content: center; margin-top: 30px; }
  @media (max-width: 680px) {
    .not-found-code { font-size: 96px; }
  }
</style>
</head>
<body data-page="not-found" data-path="~/404">
<main class="frame">
  <section class="sec not-found" data-screen-label="not-found">
    <div class="not-found-inner">
      <div class="kicker">[ exit_status: 404 ]</div>
      <div class="not-found-code" aria-hidden="true">404</div>
      <h1 class="h2">Page not found</h1>
      <p class="lede" style="margin-top:18px">That path does not exist. The image to ASCII converter is still online.</p>
      <div class="row not-found-actions">
        <a class="btn btn--green btn--lg" href="/tool">Open the tool</a>
        <a class="btn btn--ghost" href="/">Back home</a>
      </div>
    </div>
  </section>
</main>
<script type="module" src="/src/main-404.ts"></script>
</body>
</html>
