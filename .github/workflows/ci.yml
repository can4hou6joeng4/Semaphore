name: CI

# Pushes to main are covered by Deploy, which runs the same typecheck +
# build before it ships — doing both here would just double the work.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit SHA, not a floating tag: a hijacked tag
      # would run arbitrary code with this job's token. Dependabot keeps the SHA
      # and the version comment in step together.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build          # tsc --noEmit + vite build
