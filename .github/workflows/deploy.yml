name: Deploy

on:
  push:
    branches: [main]
    # README / docs / workflow edits do not change a single shipped byte
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".github/**"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

# Two pushes in quick succession must queue, never race — and an
# in-flight deploy is never cancelled halfway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Pinned to commit SHAs (see ci.yml). It matters most here: wrangler-action
      # runs with the Cloudflare deploy token in its environment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build          # tsc --noEmit + vite build
      - uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name semaphore
      # IndexNow: tell Bing/Yandex/Seznam which URLs changed. This is a
      # build-time request from the runner, never from the page, so the
      # site's connect-src 'none' is untouched. The key is public by
      # protocol design (it is served at the site root); the request
      # proves control of the host, not of a secret. Submission failures
      # must not fail a deploy that already succeeded.
      - name: Submit sitemap URLs to IndexNow
        continue-on-error: true
        run: |
          key=$(ls public | grep -E '^[0-9a-f]{64}\.txt$' | sed 's/\.txt$//')
          urls=$(grep -o '<loc>[^<]*</loc>' public/sitemap.xml | sed 's/<[^>]*>//g' | jq -R . | jq -s .)
          jq -n --arg host semaphore.bobochang.cn --arg key "$key" --argjson urlList "$urls" \
            '{host:$host, key:$key, keyLocation:("https://"+$host+"/"+$key+".txt"), urlList:$urlList}' \
            | curl -sS -o /dev/null -w 'IndexNow HTTP %{http_code}\n' \
                -H 'Content-Type: application/json; charset=utf-8' \
                --data @- https://api.indexnow.org/indexnow
