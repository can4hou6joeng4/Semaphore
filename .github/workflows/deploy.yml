name: Deploy

on:
  push:
    branches: [main]
    # README / docs / workflow edits do not change a single shipped byte
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".github/**"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

# Two pushes in quick succession must queue, never race — and an
# in-flight deploy is never cancelled halfway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Pinned to commit SHAs (see ci.yml). It matters most here: wrangler-action
      # runs with the Cloudflare deploy token in its environment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build          # tsc --noEmit + vite build
      - uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name semaphore
